[package]
name = "claude-config-manager"
version = "0.1.3"
description = "Claude Config Manager"
authors = ["Claude Config Manager Dev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_config_manager_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# M2.16 — tauri features:
#   tray-icon           (M1.1 托盘)
#   macos-private-api   (M2.16 macOS vibrancy + transparent:true 必需, 文档:
#       https://v2.tauri.app/reference/config/ → "transparent ... on macOS
#       this requires the macos-private-api feature flag, enabled under
#       tauri > macOSPrivateApi")
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
thiserror = "1"
# M2.3 — url crate for ccswitch://v1/import?... deeplink parsing.
# Version locked to the existing transitive (=2.5.8, see Cargo.lock) so
# we don't pull a second copy into the dep graph. Per CLAUDE.md §2.3.
url = "=2.5.8"
# M2.1 — uuid v4 for temp-file suffix in fs_atomic.write_with_backup.
# Already in transitive lock (uuid 1.23.3); added as direct dep so
# `infrastructure::fs_atomic` can use `Uuid::new_v4()` without feature-flag
# gymnastics. Version locked per CLAUDE.md §2.3.
uuid = { version = "=1.23.3", features = ["v4"] }

# M1.6 — 10 个 Tauri 官方 plugin（version 锁，按 SPEC.md F1-F24 需求白名单）
# 所有版本必须为 =X.Y.Z 精确锁定（CLAUDE.md §2.3），不写 ^/~。
# 顺序按白名单表，便于 review。
tauri-plugin-fs          = "=2.5.1"   # F2/F6/F13/F18/F19 文件 IO（~/.claude/**, appdata）
tauri-plugin-dialog      = "=2.7.1"   # F3 .sql picker / F5/F14 save-open 对话框
tauri-plugin-notification = "=2.3.3"  # M1.1 tray+notify 系统通知
tauri-plugin-shell       = "=2.3.5"   # shell.open / execute（M2+ reveal in explorer / git fallback）
tauri-plugin-os          = "=2.3.2"   # locale + version（About 页用）
tauri-plugin-deep-link   = "=2.4.9"   # F4 ccswitch:// deeplink 导入 provider
tauri-plugin-single-instance = { version = "=2.4.2", features = ["deep-link"] }  # F20 单实例锁（+deep-link 联动 F4）
tauri-plugin-store       = "=2.4.3"   # provider library + settings KV 持久化
tauri-plugin-log         = "=2.8.0"   # 结构化 app 日志
tauri-plugin-updater     = "=2.10.1"  # v1.1 release 自动更新（M3 阶段启用）
tauri-plugin-autostart   = "=2.5.1"   # M1.7 开机自启（IPlatformAutostart trait 实现）
tauri-plugin-process     = "=2.3.1"   # 进程管理（kill 重启 / exit 用）

# M2.16 — 原生窗口 backdrop（Win11 Mica / macOS vibrancy）。
# Tauri JS setEffects(Effect.Mica) 在 decorations:false 无边框窗口上不稳定
# (tao#72: DWM 合成路径与无边框冲突)。window-vibrancy 是 Tauri 团队官方维护的
# 底层 backdrop 库，直接对 HWND 调 DwmSetWindowAttribute(DWMWA_SYSTEMBACKDROP_TYPE)，
# 绕过 tao 装饰状态判断。0.6.0 已在 Cargo.lock 传递依赖中，直接声明不引入新下载。
# 文档: https://github.com/tauri-apps/window-vibrancy#readme
window-vibrancy = "=0.6.0"

# M2.16 — log facade。tauri-plugin-log 默认捕获 log crate 的宏
# (error!/warn!/info!)，release exe (windows_subsystem="windows" 无 stderr)
# 也能写入日志文件。log 0.4.32 已在 Cargo.lock 传递依赖中，直接声明不引入新下载。
log = "0.4"

# M4.6 — Phase 21 SQLite 历史持久层。
#   - rusqlite         同步 API,bundled feature 自带 SQLite C 库(无需系统安装)
#   - rusqlite_migration 同步 migration runner,基于 `user_version` PRAGMA
# 版本锁到 =X.Y.Z(CLAUDE.md §2.3),不写 ^/~。
# 启用时机 B(按需启动,P3 backlog)— 字段已就位,实际不读不写;
# v3.0 主线不调用 HistoryService。
#
# 注意: 1.0.0 用 `rusqlite::NO_PARAMS`(已在 0.32 移除,0.40+ 不兼容);
# 1.x 还硬锁 `rusqlite = ^0.32`,会与 =0.40.1 拉两份 rusqlite → libsqlite3-sys
# 链接冲突。2.x 解绑这两个限制,API 兼容(`M::up`/`to_latest` 都不变)。
# 详见 memory/feedback/rusqlite-migration-1.0.0-no-params-broken-with-rusqlite-0.40.md
rusqlite = { version = "=0.40.1", features = ["bundled"] }
# 1.x 系列(rusqlite 0.32 引用)与 =0.40.1 拉两份 rusqlite 进 dep graph,会
# 在 `links = "sqlite3"` 阶段炸;2.0+ 解绑到 0.32+ 的版本范围,2.6.0 是最新。
# API 兼容(`M::up`/`Migrations::new`/`to_latest` 同样可用),仅 minor 升级。
# 1.x → 2.x 的迁移点在 internal 改用 MigrationsBuilder + 显式 feature,
# 业务侧 1.x 代码迁到 2.x 通常是 0~1 行改动。
rusqlite_migration = "=2.6.0"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_Security", "Win32_UI_Controls"] }
winreg = "0.52"

# === target/ 长期治理 (2026-06-24 M3.0.3 cleanup) ===
# 历史: target/ 曾涨到 9.6GB (debug 7.4G + release 2.3G).
# 根因: cargo 默认 incremental + 完整 .rlib 符号表 + release 不 strip.
# 治理: dev 用 codegen-units=256 + debug=1; release 用 thin LTO + strip symbols.
# 预期: debug 从 7.4G → ~3.5G, release 从 2.3G → ~1.0G (合计 -53%).
# 长期: 每次 cargo build 产物体积减半, 防止无限增长.
# 见 tmp/target-cleanup-plan.md / scripts/disk-usage-check.sh.
[profile.dev]
codegen-units = 256          # LLVM parallel codegen (artifact 略小)
opt-level = 0
debug = 1                    # line tables only, 不要 full debug info
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"                 # thin LTO 替代 fat, link 快很多
opt-level = 3
debug = false
strip = "symbols"            # 关键: 去 .rlib 符号表, 缩 40-60%
