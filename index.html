<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Claude 配置管理器</title>
  </head>

  <body>
    <!--
      M2.16 splash — inline loading screen shown between Tauri launch
      and React's first paint.

      WHY THIS EXISTS
      ---------------
      Tauri v2 boot → WebView2 init → fetch + parse + eval the JS
      bundle → React mount takes ~100-300ms in release mode. During
      that gap the user sees a blank white webview. We render a
      porcelain-white splash with a spinner inline in index.html so
      the very first frame after the webview comes up shows
      *something* branded, with zero dependency on JS/CSS bundles.

      LIFECYCLE
      ---------
      1. WebView2 parses index.html → splash is visible immediately.
      2. React mounts → App.tsx's top-level useEffect (2200ms delay,
         用户明确要求 splash 至少展示 2s) adds .ccm-splash-hidden
         (CSS opacity 0, 300ms transition), then 300ms later sets
         display:none. 进度条 2s 0→100% 动画在 2200ms 时刚好跑完。
      3. FAILSAFE: if React never mounts (bundle error / eval fail),
         the inline <script> below hides the splash after 6s so the
         user is never stuck staring at a loading screen. 6s > 2200+300,
         确保failsafe不会在正常流程前触发。

      CONSTRAINTS
      -----------
      - All CSS is inline; we cannot rely on tokens.css being
        loaded (it ships inside the JS bundle, which is the whole
        reason there's a flash to hide).
      - pointer-events: none so the splash never eats a click that
        was meant for the React tree beneath.
      - z-index: 99999 puts it above AppHeader / modals.
      - alpha 0.92 (near-opaque porcelain) hides the white webview
        without fully occluding the Mica backdrop.
    -->
    <div id="ccm-splash" aria-hidden="true">
      <div class="ccm-splash-card">
        <svg
          class="ccm-splash-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <!-- lucide "Sparkles" path (M2 home tile already uses the same icon) -->
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
          <path d="M20 3v4" />
          <path d="M22 5h-4" />
          <path d="M4 17v2" />
          <path d="M5 18H3" />
        </svg>
        <div class="ccm-splash-spinner"></div>
        <div class="ccm-splash-text">Claude 配置管理器加载中…</div>
        <!-- 进度条：2s 0→100%，让用户直观感受加载进度 -->
        <div class="ccm-splash-progress"><div class="ccm-splash-progress-bar"></div></div>
      </div>
    </div>
    <style>
      #ccm-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(250, 250, 247, 0.92); /* porcelain base, near-opaque to hide white webview */
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        z-index: 99999;
        transition: opacity 300ms ease-out; /* 300ms 柔和淡出（原 200ms） */
        pointer-events: none;
      }
      #ccm-splash.ccm-splash-hidden {
        opacity: 0;
      }
      .ccm-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .ccm-splash-icon {
        width: 64px;
        height: 64px;
        color: #0969DA; /* --accent, inlined (tokens.css not yet loaded) */
        /* logo 呼吸脉冲：2s 一次 scale 1→1.1→1 + opacity 0.8→1→0.8 */
        animation: ccm-breathe 2s ease-in-out infinite;
      }
      .ccm-splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(9, 105, 218, 0.15);
        border-top-color: #0969DA;
        border-radius: 50%;
        animation: ccm-splash-spin 0.8s linear infinite;
      }
      .ccm-splash-text {
        font-size: 14px;
        color: #656D76; /* --text-secondary */
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        /* 文字淡入：400ms ease-out，只播一次 */
        animation: ccm-fade-in 400ms ease-out;
      }
      /* 进度条容器：细长条，底部 */
      .ccm-splash-progress {
        width: 180px;
        height: 3px;
        background: rgba(9, 105, 218, 0.12);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 4px;
      }
      /* 进度条填充：2s 0→100%，与 splash 展示时长对齐 */
      .ccm-splash-progress-bar {
        width: 0%;
        height: 100%;
        background: #0969DA;
        border-radius: 2px;
        animation: ccm-progress 2s ease-out forwards;
      }
      @keyframes ccm-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* logo 呼吸脉冲 keyframes */
      @keyframes ccm-breathe {
        0%, 100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
      }
      /* 文字淡入 keyframes */
      @keyframes ccm-fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* 进度条 keyframes */
      @keyframes ccm-progress {
        from {
          width: 0%;
        }
        to {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ccm-splash-spinner {
          animation-duration: 3s;
        }
        .ccm-splash-icon {
          animation: none;
        }
        .ccm-splash-text {
          animation: none;
        }
        .ccm-splash-progress-bar {
          animation-duration: 4s;
        }
      }
    </style>
    <script>
      // FAILSAFE — if React never mounts (JS eval error, bundle 404,
      // etc.) we cannot leave the user staring at a loading screen
      // forever. M3.1: tightened from 6000ms → 4500ms because the
      // primary path now hides the splash via the `tauri://ready`
      // event (driven by lib.rs after webview first-paint handshake),
      // which lands well under 1s on warm machines. 4.5s is the
      // React-mount sanity backstop (covers slow machines + dev HMR
      // scenarios where the event listener may not be wired up by
      // the time the event fires). App.tsx has its own 8s hard
      // failsafe as the last resort (jsdom tests + some embedded
      // webview modes without index.html).
      (function () {
        setTimeout(function () {
          var s = document.getElementById("ccm-splash");
          if (s && !s.classList.contains("ccm-splash-hidden")) {
            s.classList.add("ccm-splash-hidden");
            setTimeout(function () {
              s.style.display = "none";
            }, 300);
          }
        }, 4500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
