name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel duplicate runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Rust — unit tests + clippy
  # ---------------------------------------------------------------------------
  test-rust:
    name: Rust tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # M1.11 fix (F-1.06): pin to a specific stable version so CI
        # behaviour does not drift when Rust publishes a new minor.
        # Bump via PR when intentional.
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install MSYS2 + MinGW windres (Tauri build deps)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-cc

      - name: Build & test (integration tests in tests/)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          cd src-tauri
          cargo test --no-default-features --no-run
          # Run integration tests directly (avoid the lib-test DLL load
          # issue on Windows — see Rust Windows dev box reference).
          for t in tests/*.rs; do
            name=$(basename "$t" .rs)
            cargo test --test "$name" --no-default-features
          done

      - name: Clippy
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          cd src-tauri
          cargo clippy --all-targets --no-deps -- -D warnings

  # ---------------------------------------------------------------------------
  # 2. Frontend — Vitest unit tests + production build
  # ---------------------------------------------------------------------------
  # M2.17-C1: this job is the canonical "every push must keep TS/Vite
  # healthy" gate. We run BOTH `tsc --noEmit` (type-only, fast) AND a
  # full `npm run build` (tsc + vite build) so that type errors AND
  # Vite bundler errors both break the build. Vitest runs last as the
  # final correctness check.
  test-frontend:
    name: Frontend unit tests + build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # M1.11 fix (F-1.06): pin Node to a specific patch version.
          # Bump via PR when intentional.
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Fast type-only check (no JS emit). If this fails, the next
        # `npm run build` step will also fail — kept explicit so CI logs
        # surface the type error first.
        run: npx tsc --noEmit

      - name: Production build (tsc + vite build)
        # Runs `tsc && vite build` (see package.json "build" script).
        # This is the same command that `tauri.conf.json`'s
        # `build.beforeBuildCommand` runs before cargo, so a green
        # build here implies the Tauri release build won't fail on a
        # stale `dist/`.
        run: npm run build

      - name: Run Vitest
        # `--run` forces non-watch mode in CI.
        run: npm test -- --run

  # ---------------------------------------------------------------------------
  # 3. E2E — Playwright via tauri-driver
  # ---------------------------------------------------------------------------
  # M2.17-C2: the e2e job is configured but currently SKIPPED
  # (`if: ${{ false }}` on each matrix entry below) for two reasons:
  #
  #   1. The dev box cannot run `tauri-driver` reliably (DLL load
  #      restrictions, see "Rust Windows dev box" reference). So we
  #      have no green reference run to compare CI against.
  #   2. Mac tauri-driver setup is non-trivial (codesigning, helper
  #      bundling); defer until M2.x.
  #
  # When un-skipping: remove the `if:` line on each matrix entry, then
  # verify the runner has the `tauri-driver` binary on PATH
  # (`npm install -g @tauri-apps/tauri-driver`).
  e2e:
    name: E2E (tauri-driver, ${{ matrix.os }})
    # TODO: dev box 无法 tauri-driver（无 wix 工具链），CI runner 需
    # tauri-driver binary；本 job 在配置生效前 skip。
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # M1.11 fix (F-1.06): pin Node to a specific patch version.
          # Bump via PR when intentional.
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install MSYS2 + MinGW windres (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-cc

      - name: Install Rust toolchain
        # M1.11 fix (F-1.06): pin to a specific stable version so CI
        # behaviour does not drift when Rust publishes a new minor.
        # Bump via PR when intentional.
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build the Tauri debug exe
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          npm run tauri build -- --debug

      - name: Install tauri-driver
        run: npm install -g @tauri-apps/tauri-driver

      - name: Install Playwright browsers
        # M1.11 fix (F-1.06): pin Playwright to the project-declared version
        # (see package.json devDependencies) so CI does not silently
        # upgrade to the latest release.
        run: npx -y playwright@1.49.1 install --with-deps chromium

      - name: Run Playwright e2e
        shell: msys2 {0}
        env:
          TAURI_DRIVER_PORT: 4444
        run: |
          export PATH="/mingw64/bin:$PATH"
          # Start tauri-driver in the background; it serves WebDriver on
          # $TAURI_DRIVER_PORT. Playwright connects to it via the
          # `wdio`-style remote URL configured in playwright.config.ts.
          tauri-driver --port 4444 &
          sleep 5
          npx playwright test

  # ---------------------------------------------------------------------------
  # 4. macOS 编译门禁 — cargo check + 前端 build + vitest
  # ---------------------------------------------------------------------------
  # P1-6 修复 (M2.16): 加 macos-latest job 防止 Mac 运行时崩溃无门禁。
  # release.yml 已在 git tag 时构建 macOS dmg,但 push/PR 时无 Mac 编译门禁,
  # 导致 Mac 专属 impl (MacPaths / MacReveal / MacGitHost) 一旦 unimplemented!()
  # 或 cfg 漏洞,只在 release 时才暴露。本 job 每次 push/PR 跑 cargo check +
  # npm build + vitest,确保 Mac impl 编译通过。
  # 不跑 tauri-driver e2e —— Mac 上配置复杂,本次只做编译+单测门禁
  # (见上方 e2e job 的 Windows 参考实现)。
  build-macos:
    name: macOS gate (cargo check + vitest, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # M1.11 fix (F-1.06): 与 Windows 同版本锁死,避免 Rust 发新版时 CI 行为漂移。
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          # macos-latest = macos-14 (arm64 M1);显式锁 target 保证确定性
          # (与 release.yml matrix 的 aarch64-apple-darwin 对齐)。
          targets: aarch64-apple-darwin

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          # M1.11 fix (F-1.06): 与 Windows 同 patch 版本锁死。
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: cargo check (Mac 编译门禁)
        # 门禁核心:确保 Mac impl 编译通过 —— 无 unimplemented!()、无漏 Mac 的 cfg。
        # Windows 专属依赖 (windows / winreg) 在 Cargo.toml 里 cfg(windows) 门控,
        # Mac 上自动跳过,不影响 check。
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build frontend (跨平台)
        run: npm run build

      - name: Run Vitest (跨平台)
        run: npm test -- --run
